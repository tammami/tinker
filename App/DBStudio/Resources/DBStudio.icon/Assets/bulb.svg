<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="scale(10.24)">
  <!-- The bulb: glass, neck and screw base. Drawn in the same 100-unit space
       Scripts/make-icon.swift uses, with y flipped for SVG. -->
  <g fill="#FFFAE0">
    <circle cx="46" cy="40" r="24"/>
    <path d="M33 58 H59 L55 68 H37 Z"/>
  </g>
  <g fill="#D9E0F2">
    <rect x="37"   y="69.6" width="18"   height="4.4" rx="1.6"/>
    <rect x="38.1" y="75.1" width="15.8" height="4.4" rx="1.6"/>
    <rect x="39.2" y="80.6" width="13.6" height="4.4" rx="1.6"/>
  </g>
  <!-- Filament: two legs into one loop. -->
  <path d="M39 56 V46 Q46 32 53 46 V56"
        fill="none" stroke="#F29E29" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three thought dots rising to the upper right. -->
  <g fill="#FFFFFF" fill-opacity="0.92">
    <circle cx="76" cy="38" r="3"/>
    <circle cx="83" cy="29" r="4.2"/>
    <circle cx="88" cy="17" r="5.6"/>
  </g>
  </g>
</svg>
