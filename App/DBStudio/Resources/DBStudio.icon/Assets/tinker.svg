<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- An abstract mark for a database: three layers fanned out from one hinge, the way a
       stack of discs would look mid-shuffle. Warm cream on terracotta, soft and few, so it
       reads at sixteen points and is easy to place in a Dock. Drawn in a 100-unit space. -->
  <g transform="scale(10.24)">
    <g fill="#F6EEE2" stroke="none">
      <g transform="rotate(-18 30 62)">
        <rect x="24" y="52" width="52" height="16" rx="8"/>
      </g>
      <g transform="rotate(0 30 62)">
        <rect x="24" y="52" width="52" height="16" rx="8" fill-opacity="0.9"/>
      </g>
      <g transform="rotate(18 30 62)">
        <rect x="24" y="52" width="52" height="16" rx="8" fill-opacity="0.8"/>
      </g>
      <!-- The hinge the layers turn on. -->
      <circle cx="30" cy="60" r="7" fill="#2B1D16" fill-opacity="0.18"/>
      <circle cx="30" cy="60" r="4.5"/>
    </g>
  </g>
</svg>
