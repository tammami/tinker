<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tinker: a database with a spanner across it. Few, large shapes, because at
       sixteen points anything finer turns to mush. Drawn in a 100-unit space. -->
  <g transform="scale(10.24)">
    <!-- The database: a stack of three discs, the top face lit. -->
    <g fill="#FFFFFF">
      <path d="M18 34 V52 A26 8.5 0 0 0 70 52 V34 A26 8.5 0 0 1 18 34 Z" fill-opacity="0.90"/>
      <path d="M18 52 V70 A26 8.5 0 0 0 70 70 V52 A26 8.5 0 0 1 18 52 Z" fill-opacity="0.78"/>
      <ellipse cx="44" cy="34" rx="26" ry="8.5"/>
    </g>
    <!-- Grooves between the discs. -->
    <g fill="none" stroke="#1E4FB0" stroke-opacity="0.35" stroke-width="2">
      <path d="M18 52 A26 8.5 0 0 0 70 52"/>
    </g>
    <!-- The spanner, laid diagonally from lower left to upper right: a rounded shaft,
         a round head, and the open jaw cut out of the head in the background colour. -->
    <g transform="rotate(-45 62 46)">
      <rect x="57" y="34" width="10" height="52" rx="5" fill="#FFCF4D"/>
      <circle cx="62" cy="30" r="13" fill="#FFCF4D"/>
      <rect x="57.5" y="12" width="9" height="18" fill="#2E5CC2"/>
    </g>
  </g>
</svg>
