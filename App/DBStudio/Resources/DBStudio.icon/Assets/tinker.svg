<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tinker, after the Dota hero of the same name: a keen little inventor in big brass
       goggles. An original, coarse likeness — a round green head, pointed ears, two
       goggle lenses and a grin — not the game's artwork. Drawn in a 100-unit space. -->
  <g transform="scale(10.24)">
    <!-- Ears, behind the head. -->
    <g fill="#5FA85A">
      <path d="M22 46 L6 34 L14 58 Z"/>
      <path d="M78 46 L94 34 L86 58 Z"/>
    </g>
    <!-- Head. -->
    <ellipse cx="50" cy="52" rx="30" ry="29" fill="#6DBE68"/>
    <!-- Goggle strap across the forehead. -->
    <path d="M22 40 Q50 32 78 40 L78 47 Q50 39 22 47 Z" fill="#6B4A2B"/>
    <!-- Goggles: brass rims, glowing lenses, a highlight on each. -->
    <g>
      <circle cx="37" cy="44" r="12.5" fill="#C9962F"/>
      <circle cx="63" cy="44" r="12.5" fill="#C9962F"/>
      <rect x="47" y="41.5" width="6" height="5" rx="1.5" fill="#C9962F"/>
      <circle cx="37" cy="44" r="9" fill="#5FE0FF"/>
      <circle cx="63" cy="44" r="9" fill="#5FE0FF"/>
      <circle cx="37" cy="44" r="9" fill="#1D6E86" fill-opacity="0.55"/>
      <circle cx="63" cy="44" r="9" fill="#1D6E86" fill-opacity="0.55"/>
      <circle cx="33.5" cy="40.5" r="2.6" fill="#FFFFFF" fill-opacity="0.9"/>
      <circle cx="59.5" cy="40.5" r="2.6" fill="#FFFFFF" fill-opacity="0.9"/>
    </g>
    <!-- Nose and grin. -->
    <ellipse cx="50" cy="58" rx="4.5" ry="3.5" fill="#4E9A4A"/>
    <path d="M36 66 Q50 78 64 66" fill="none" stroke="#2F4F2C" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 67 h20 v3 h-20 z" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
