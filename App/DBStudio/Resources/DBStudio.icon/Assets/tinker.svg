<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- An abstract mark for a database: five layers fanned out from one hinge, mirror-
       symmetric and centred on the icon grid. Warm cream on terracotta; few, soft shapes
       that read at sixteen points. Drawn in a 100-unit space, scaled up. -->
  <g transform="scale(10.24)">
    <g fill="#F6EEE2">
      <rect x="44" y="26" width="12" height="46" rx="6" transform="rotate(-44 50 72)" fill-opacity="0.72"/>
      <rect x="44" y="26" width="12" height="46" rx="6" transform="rotate(-22 50 72)" fill-opacity="0.86"/>
      <rect x="44" y="26" width="12" height="46" rx="6"/>
      <rect x="44" y="26" width="12" height="46" rx="6" transform="rotate(22 50 72)" fill-opacity="0.86"/>
      <rect x="44" y="26" width="12" height="46" rx="6" transform="rotate(44 50 72)" fill-opacity="0.72"/>
    </g>
    <!-- The hinge the layers turn on. -->
    <circle cx="50" cy="72" r="9" fill="#2B1D16" fill-opacity="0.16"/>
    <circle cx="50" cy="72" r="5.5" fill="#F6EEE2"/>
  </g>
</svg>
