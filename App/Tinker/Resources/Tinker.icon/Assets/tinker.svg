<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A winged database: the open top rim of a cylinder, two wings rising from it, and two
       banded rings below. Mirror-symmetric on the vertical axis, drawn in a 100-unit space
       and scaled up. One gradient carries the whole mark, deep navy at the foot to teal at
       the wing tips. -->
  <defs>
    <linearGradient id="mark" x1="0.12" y1="1" x2="0.92" y2="0.05">
      <stop offset="0" stop-color="#16306B"/>
      <stop offset="0.45" stop-color="#255C9B"/>
      <stop offset="1" stop-color="#57C6C2"/>
    </linearGradient>
  </defs>
  <g transform="scale(10.24)">
    <!-- The cylinder's open top, behind the wings. -->
    <ellipse cx="50" cy="32" rx="20" ry="7.6" fill="none" stroke="url(#mark)" stroke-width="4.4"/>

    <!-- Wings: three broad blades a side, rooted at the centre and drawn once, then
         mirrored. Each blade is a leading edge out to the tip and a trailing edge back,
         so it carries width instead of reading as a spike. -->
    <g fill="url(#mark)">
      <g id="wing">
        <path d="M50 50 C64 36 80 20 96 8 C88 28 74 42 50 57 Z"/>
        <path d="M50 59 C63 48 78 37 93 27 C84 43 70 54 50 65 Z"/>
        <path d="M50 67 C60 60 72 53 84 48 C76 58 65 64 50 72 Z"/>
      </g>
      <use href="#wing" transform="translate(100 0) scale(-1 1)"/>
    </g>

    <!-- Two rings, ends dipping below the middle the way a band around a drum reads. -->
    <g fill="url(#mark)">
      <path d="M14 68 C26 61 74 61 86 68 L86 78.5 C74 71.5 26 71.5 14 78.5 Z"/>
      <path d="M17 83 C28 76 72 76 83 83 L83 93.5 C72 86.5 28 86.5 17 93.5 Z"/>
    </g>
  </g>
</svg>
