<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A lit light bulb: a warm glow behind a round bulb, a short neck and a two-ring
       base, mirror-symmetric on the vertical axis and centred on the icon grid. Drawn in
       a 100-unit space, scaled up. -->
  <defs>
    <radialGradient id="glow" cx="50" cy="42" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE38A" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FFC94D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="1" stop-color="#FFD05A"/>
    </linearGradient>
  </defs>
  <g transform="scale(10.24)">
    <!-- Glow -->
    <circle cx="50" cy="42" r="34" fill="url(#glow)"/>
    <!-- Rays -->
    <g stroke="#FFE38A" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
      <line x1="50" y1="6" x2="50" y2="12"/>
      <line x1="16" y1="42" x2="22" y2="42"/>
      <line x1="84" y1="42" x2="78" y2="42"/>
      <line x1="26" y1="18" x2="30.5" y2="22.5"/>
      <line x1="74" y1="18" x2="69.5" y2="22.5"/>
    </g>
    <!-- Bulb -->
    <path d="M50 20 C36.5 20 28 30 28 42 C28 50.5 33 55.5 37 60.5 C39.5 63.5 41 66 41 70 L59 70 C59 66 60.5 63.5 63 60.5 C67 55.5 72 50.5 72 42 C72 30 63.5 20 50 20 Z" fill="url(#bulb)"/>
    <!-- Filament -->
    <path d="M43 64 L43 55 L46.5 59.5 L50 52.5 L53.5 59.5 L57 55 L57 64" fill="none" stroke="#E8963C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Base -->
    <rect x="40" y="70" width="20" height="5" rx="2" fill="#C9B79A"/>
    <rect x="40" y="77" width="20" height="5" rx="2" fill="#C9B79A"/>
    <path d="M43 84 L57 84 C57 88 54 90 50 90 C46 90 43 88 43 84 Z" fill="#B3A184"/>
  </g>
</svg>
